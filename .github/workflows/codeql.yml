# Security scan (CodeQL). Builds the app with Gradle so the Kotlin code can be analysed,
# and also checks the GitHub Actions workflows.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 17 * * 1"   # weekly, Tuesday early morning Sydney time

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v5

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Debug build: no signing key needed. Kotlin runs in-process so CodeQL can see it.
      - if: matrix.language == 'java-kotlin'
        run: gradle assembleDebug --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
